# SPDX-License-Identifier: GPL-3.0-or-later
name: Upload to Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing verified release tag (for example v0.1.3)'
        required: true
        type: string
      track:
        description: 'Draft destination track; never a rollout and never production'
        type: choice
        default: internal
        options: [internal, alpha, beta]
      dry_run:
        description: 'Verify release files only; do not authenticate or contact Google Play'
        type: boolean
        default: false
      review_submission:
        description: 'Review handling of the committed edit; never a rollout'
        type: choice
        default: auto
        options: [auto, suppress]

permissions:
  contents: read
  actions: read

# All Play edits for this app share one queue, including different versions/tracks.
concurrency:
  group: google-play-it.stefanogozzi.dayrows
  cancel-in-progress: false

jobs:
  upload:
    # Execute trusted uploader code from main, never from the selected release tag.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: google-play
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PLAY_TRACK: ${{ inputs.track }}
      PLAY_REVIEW_SUBMISSION: ${{ inputs.review_submission }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Use temporary storage outside the checkout
        run: echo "DELIVERY_DIR=$RUNNER_TEMP/dayrows-play" >> "$GITHUB_ENV"

      - name: Download and verify existing release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIGNER: ${{ vars.DAYROWS_UPLOAD_CERT_SHA256 }}
        run: |
          python3 scripts/play_upload.py prepare \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --track "$PLAY_TRACK" \
            --directory "$DELIVERY_DIR" --expected-signer "$EXPECTED_SIGNER"

      - name: Authenticate to Google Play
        if: ${{ !inputs.dry_run }}
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload signed AAB and commit the Google Play draft
        if: ${{ !inputs.dry_run }}
        id: upload
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 scripts/play_upload.py upload --directory "$DELIVERY_DIR" \
            --review-submission "$PLAY_REVIEW_SUBMISSION"

      - name: Retain delivery evidence separately from the GitHub release
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: google-play-${{ inputs.release_tag }}-${{ inputs.track }}
          path: ${{ runner.temp }}/dayrows-play/delivery.json
          if-no-files-found: warn
          retention-days: 90

      - name: Delivery summary
        if: ${{ always() }}
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -f "$DELIVERY_DIR/delivery.json" ]; then
            args=(--directory "$DELIVERY_DIR" --upload-outcome "$UPLOAD_OUTCOME")
            if [ "$DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            fi
            python3 scripts/play_upload.py summary "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi
