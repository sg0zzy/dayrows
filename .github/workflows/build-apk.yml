# SPDX-License-Identifier: GPL-3.0-or-later
name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test repository infrastructure
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Set up Java 21 and Gradle cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties

      # GitHub's Ubuntu 24.04 image provides the Android command-line tools and licenses.
      - name: Install required Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Build, test and lint debug target
        env:
          DAYROWS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DAYROWS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/build-debug.sh testDebugUnitTest lintDebug --no-daemon --console=plain

      - name: Upload debug APK and build manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dayrows-android-debug-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: local_artifacts/*/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dayrows-reports-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve incomplete build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dayrows-incomplete-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: local_artifacts/*/build-info.json
          if-no-files-found: warn
          retention-days: 14
